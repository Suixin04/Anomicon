name: Anomicon release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish if the configured version has no release or tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anomicon-release-${{ github.ref }}
  queue: max

jobs:
  prepare:
    if: github.repository == 'Suixin04/Anomicon' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      asset: ${{ steps.metadata.outputs.asset }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and generate release notes
        id: metadata
        env:
          NOTES_FILE: ${{ runner.temp }}/anomicon-release-notes.md
        run: node scripts/release-metadata.mjs "$NOTES_FILE"
      - name: Skip existing releases and tags
        id: check
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if git show-ref --verify --quiet "refs/tags/$TAG" || grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "Tag or release already exists: $TAG"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: release-notes
          path: ${{ runner.temp }}/anomicon-release-notes.md
          if-no-files-found: error
          overwrite: true

  build:
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64, harmonyos-api26]
    timeout-minutes: 30
    steps:
      - name: Download source for this commit
        shell: bash
        run: |
          archive="$RUNNER_TEMP/anomicon-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --speed-limit 1024 --speed-time 90 --retry-max-time 1200 \
            --max-time 900 --output "$archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA"
          source_dir="$RUNNER_TEMP/anomicon-src-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$source_dir"
          tar -xzf "$archive" -C "$source_dir" --strip-components=1
      - name: Build unsigned phone HAP
        working-directory: ${{ runner.temp }}/anomicon-src-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          ASSET: ${{ needs.prepare.outputs.asset }}
          OUTPUT_DIR: ${{ runner.temp }}/anomicon-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          : "${DEVECO_SDK_HOME:?Configure the API 26 SDK on the runner}"
          command -v ohpm
          command -v hvigorw
          ohpm install --all
          node scripts/test-host.mjs
          hvigorw --no-daemon --mode module -p module=phone@default -p product=default -p buildMode=release assembleHap
          mkdir -p "$OUTPUT_DIR"
          cp products/phone/build/default/outputs/default/phone-default-unsigned.hap "$OUTPUT_DIR/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: phone-hap
          path: ${{ runner.temp }}/anomicon-${{ github.run_id }}-${{ github.run_attempt }}/*.hap
          if-no-files-found: error
          overwrite: true

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: phone-hap
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          printf '\n> 附件为未签名 HAP，真机安装需自行签名或配合相应安装方式。\n' >> release-notes/anomicon-release-notes.md
          gh release create "$TAG" "release-assets/$ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file release-notes/anomicon-release-notes.md
